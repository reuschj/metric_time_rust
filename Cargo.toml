[package]
name = "metric_time"
version = "0.1.0"
edition = "2021"
description = "A Rust library for working with metric (decimal) time format"
repository = "https://github.com/yourusername/metric_time"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.38", optional = true, default-features = false }
console_error_panic_hook = { version = "0.1.7", optional = true, default-features = false }
futures = "0.3.31"
getrandom = { version = "0.2.16", optional = true, default-features = false, features = ["js"] }
gloo-timers = { version = "0.3.0", optional = true, default-features = false }
js-sys = { version = "0.3.82", optional = true, default-features = false }
num = "0.4.3"
rand = { version = "0.8.5", optional = true, default-features = false }
ryu = "1.0.18"
tokio = { version = "1.41.1", optional = true, default-features = false }
tokio-stream = { version = "0.1.16", optional = true, default-features = false }
web-time = { version = "1.1.0", optional = true, default-features = false }
wasm-bindgen = { version = "0.2.100", optional = true, default-features = false }
wasm-bindgen-futures = { version = "0.4.37", optional = true, default-features = false }
web-sys = { version = "0.3.77", features = ["Window", "console"], optional = true, default-features = false }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[features]
standard = [
    "dep:chrono",
    "chrono/clock",
    "dep:console_error_panic_hook",
    "dep:tokio",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "dep:tokio-stream",
    "dep:rand",
    "dep:getrandom",
    "rand/getrandom",
    "rand/std",
    "rand/std_rng",
]
web = [
    "dep:chrono",
    "chrono/clock",
    "chrono/wasmbind",
    "dep:getrandom",
    "getrandom/js",
    "dep:js-sys",
    "dep:rand",
    "dep:gloo-timers",
    "gloo-timers/futures",
    "dep:tokio",
    "tokio/macros",
    "tokio/sync",
    "dep:tokio-stream",
    "tokio-stream/sync",
    "dep:web-time",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "web-sys/Window",
    "web-sys/console",
]
default = ["standard"]

[profile.release]
opt-level = "s"
debug = false
